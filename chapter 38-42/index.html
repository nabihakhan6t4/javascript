<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leap Year Checker and Power Function</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Leap Year Checker</h1>
        <input type="number" id="yearInput" placeholder="Enter a year">
        <button onclick="checkLeapYear()">Check Leap Year</button>
        <p id="result"></p>

        <h1>Power Function</h1>
        <input type="number" id="baseInput" placeholder="Enter base">
        <input type="number" id="exponentInput" placeholder="Enter exponent">
        <button onclick="calculatePower()">Calculate Power</button>
        <p id="powerResult"></p>
    </div>
    <div class="container">
        <h1>Triangle Area Calculator</h1>
        <input type="number" id="sideA" placeholder="Enter side a">
        <input type="number" id="sideB" placeholder="Enter side b">
        <input type="number" id="sideC" placeholder="Enter side c">
        <button onclick="calculateTriangleArea()">Calculate Area</button>
        <p id="areaResult"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
