<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Events Examples</title>
    <!-- Link to Bootstrap CSS -->
    <link
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Link to Custom CSS -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container text-center mt-5">
      <h1 class="mb-4">JavaScript Events Examples</h1>

      <!-- Question 1: Alert on Link Click -->
      <h2>1. Alert on Link Click</h2>
      <a href="#" id="alertLink" class="btn btn-primary">Click Me!</a>

      <!-- Question 2: Mobile Images with Click Alert -->
      <h2 class="mt-5">2. Click on the Mobile Images</h2>
      <div class="row">
        <div class="col-md-4 mb-4">
          <img
            src="images/mobile1.jpeg"
            alt="Mobile 1"
            class="img-fluid clickable-image"
            data-message="Mobile 1"
          />
        </div>
        <div class="col-md-4 mb-4">
          <img
            src="images/mobile2.jpeg"
            alt="Mobile 2"
            class="img-fluid clickable-image"
            data-message="Mobile 2"
          />
        </div>
        <div class="col-md-4 mb-4">
          <img
            src="images/mobile3.jpeg"
            alt="Mobile 3"
            class="img-fluid clickable-image"
            data-message="Mobile 3"
          />
        </div>
      </div>

      <!-- Question 3: Student Records with Delete Button -->
      <h2 class="mt-5">3. Student Records</h2>
      <table class="table table-bordered">
        <thead>
          <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Class</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="studentTable">
          <tr>
            <td>John</td>
            <td>15</td>
            <td>10th</td>
            <td><button class="btn btn-danger delete-btn">Delete</button></td>
          </tr>
          <tr>
            <td>Jane</td>
            <td>16</td>
            <td>11th</td>
            <td><button class="btn btn-danger delete-btn">Delete</button></td>
          </tr>
          <!-- Add more student rows as needed -->
        </tbody>
      </table>

      <!-- Question 4: Image Mouseover -->
      <h2 class="mt-5">4. Image Mouseover</h2>
      <img
        id="myImage"
        src="images/original-image.jpeg"
        alt="Image"
        class="img-fluid"
      />
      <h2 class="mt-5">5. Counter</h2>
      <p id="counterValue" class="display-4">0</p>
      <button id="decreaseButton" class="btn btn-danger">Decrease</button>
      <button id="increaseButton" class="btn btn-success">Increase</button>
    </div>

    <!-- Link to Custom JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
